name: Build Free My TV for Philips Android TV

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Free My TV
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Restore signing key for future updates
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: freemytv-signing-${{ github.repository_id }}-v1

      - name: Set preferences for Russian-language TV
        run: |
          cp config.example.properties config.properties
          sed -i 's/^tmdb_region=.*/tmdb_region=RU/' config.properties
          sed -i 's/^latitude=.*/latitude=53.1959/' config.properties
          sed -i 's/^longitude=.*/longitude=50.1008/' config.properties
          sed -i 's/^city=.*/city=Самара/' config.properties
          sed -i 's/^language=.*/language=ru/' config.properties
          sed -i 's/^temperature=.*/temperature=C/' config.properties
          sed -i 's/^show_crypto=.*/show_crypto=false/' config.properties
          sed -i 's/^disable_assistant=.*/disable_assistant=false/' config.properties
          # No TMDB token is embedded. Add it privately later if desired.

      - name: Build signed APK
        run: bash build.sh

      - name: Make APK downloadable
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Philips-Android-TV
          path: FreeMyTV.apk
          if-no-files-found: error
          retention-days: 30
